[package]
name = "cr-gui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "GPUI desktop interface for calibre-rust"
publish = false

[[bin]]
name = "calibre-rust"
path = "src/main.rs"

[dependencies]
cr-core = { path = "../cr-core" }
gpui-kit = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
