name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  release:
    name: Release ${{ matrix.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release binaries (${{ matrix.name }})
        run: cargo build --release --workspace

      - name: Write run summary
        run: |
          binary_size=$(ls -lh target/release/cr | awk '{print $5}')
          rust_version=$(rustc --version)
          {
            echo "### Release build: ${{ matrix.name }}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Platform | \`${{ matrix.name }}\` |"
            echo "| Runner | \`${{ matrix.os }}\` |"
            echo "| Binary | \`target/release/cr\` (${binary_size}) |"
            echo "| Toolchain | \`${rust_version}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test core and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace

  gui:
    name: Check and test GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - name: Test GUI
        working-directory: crates/cr-gui
        run: cargo test
